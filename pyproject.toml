[project]
name = "tavily-agent-starter"
version = "0.1.0"
description = "Starter pack for building web-connected agents with Tavily."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "deepagents>=0.7.41",
    "langchain-nebius>=0.1.3",
    "langchain-tavily>=0.2.18",
    "openai>=1.60.0",
    "tavily-python>=0.7.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
